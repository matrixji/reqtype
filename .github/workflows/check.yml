name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    uses: ./.github/workflows/desktop-build.yml
    with:
      artifact-prefix: ci
  required:
    name: CI required
    if: always()
    needs: desktop
    runs-on: ubuntu-24.04
    steps:
      - name: Require all desktop checks
        env:
          RESULT: ${{ needs.desktop.result }}
        run: test "$RESULT" = success
